apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bachelor-3tier-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/timopeters-dev/bachelor-gitops-demo.git
    targetRevision: HEAD
    path: workloads/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
